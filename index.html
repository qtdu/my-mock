<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mock JSON</title>
</head>
<body>
  <h1>Mock JSON Editor</h1>

  <textarea id="jsonBox" rows="20" cols="80"></textarea><br>

  <button onclick="loadJson()">Load JSON</button>
  <button onclick="saveJson()">Save JSON</button>
  <button onclick="clearJson()">Clear JSON</button>

  <script>
    async function loadJson() {
      const res = await fetch("/.netlify/functions/load");
      const data = await res.json();
      document.getElementById("jsonBox").value = JSON.stringify(data, null, 2);
    }

    async function saveJson() {
      const txt = document.getElementById("jsonBox").value;

      await fetch("/.netlify/functions/save", {
        method: "POST",
        body: txt
      });

      alert("Saved!");
    }

    async function clearJson() {
      await fetch("/.netlify/functions/clear");
      alert("Cleared!");
    }
  </script>
</body>
</html>
